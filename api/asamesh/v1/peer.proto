// 管理器 ↔ 管理器。跑在端到端 mTLS 之上（直连或经中转），见
// docs/REMOTE_MANAGER_MESH_PLAN.md §5.5、§12 P1-1、P3-3、P3-4、P6。
//
// 兼容规则同 coordinator.proto：只做向后兼容的增量，字段号永不复用。
syntax = "proto3";

package asamesh.v1;

option go_package = "asa-server/internal/mesh/meshpb;meshpb";

import "asamesh/v1/coordinator.proto";

service Peer {
  // 版本、能力列表、对方授予我的角色。未配对的身份也能调用。
  rpc Hello(HelloRequest) returns (HelloResponse);
  // 配对：带邀请码直接完成，不带则提交一条待批准的申请。未配对的身份也能调用。
  rpc Pair(PairRequest) returns (PairResponse);
  // HTTP 隧道：一个 HTTP 请求 = 一条流（§7）。只对已授权的身份开放。
  rpc HTTP(stream HTTPFrame) returns (stream HTTPFrame);
  // 打洞信令（§12 P6-3）：只在中转路径上调用。调用者带上自己的 UDP 候选与探测密钥，
  // 被叫方回自己的候选并立即开始探测。只对已授权的身份开放；本机关了打洞时返回 FailedPrecondition。
  rpc Punch(PunchRequest) returns (PunchResponse);
}

enum Role {
  ROLE_NONE = 0;
  ROLE_OPERATOR = 1;
  ROLE_ADMIN = 2;
}

message HelloRequest {
  string version = 1;
  repeated string capabilities = 2;
}

message HelloResponse {
  string version = 1;
  repeated string capabilities = 2;
  // 对方授予调用者的角色；未授权为 ROLE_NONE。
  Role granted_role = 3;
  // 只对已授权的身份填写。
  string label = 4;
}

enum PairStatus {
  PAIR_STATUS_UNSPECIFIED = 0;
  // 已授权（带有效邀请码，或之前就授权过）。
  PAIR_STATUS_PAIRED = 1;
  // 已提交申请，等对方的管理员批准。
  PAIR_STATUS_PENDING = 2;
}

message PairRequest {
  // 邀请编号与一次性密钥；都为空 = 申请-批准。
  string invite_id = 1;
  bytes invite_secret = 2;
  // 调用者的备注名与版本（显示在对方的待批准列表里）。
  string label = 3;
  string version = 4;
}

message PairResponse {
  PairStatus status = 1;
  Role granted_role = 2;
  // 对方的备注名（只在 PAIRED 时填写）。
  string label = 3;
}

// HTTPFrame 是隧道流上的信封。A→B：request，然后 body*，然后 end；协议升级（WebSocket）之后
// A→B 继续发 body。B→A：response，然后 body*，然后 end；或者连接被劫持时直接发 raw（含 101 响应行）。
message HTTPFrame {
  oneof msg {
    HTTPRequestHead request = 1;
    HTTPResponseHead response = 2;
    bytes body = 3;
    // 发送方的 body 结束。不用 CloseSend：协议升级后 A 还要继续发数据。
    HTTPBodyEnd end = 4;
    // B→A：连接被劫持之后的原始字节，由 A 解析出 101 响应。
    bytes raw = 5;
  }
}

message HTTPRequestHead {
  string method = 1;
  // 已转义的路径（以 / 开头）与查询串（不含 ?）。
  string path = 2;
  string raw_query = 3;
  repeated HTTPHeader headers = 4;
  // A 上发起者的用户名。B 只用于审计，**不**作为授权依据。
  string remote_user = 5;
}

message HTTPResponseHead {
  int32 status = 1;
  repeated HTTPHeader headers = 2;
}

message HTTPHeader {
  string name = 1;
  repeated string values = 2;
}

message HTTPBodyEnd {}

// NATMapping 是 STUN 判出的 NAT 映射行为（pkg/stun.Mapping）。
enum NATMapping {
  NAT_MAPPING_UNKNOWN = 0;
  // 没有 NAT：反射地址就是本机地址。
  NAT_MAPPING_NONE = 1;
  // 映射与目的无关（NAT1～NAT3），易打洞。
  NAT_MAPPING_EASY = 2;
  // 映射随目的变化（对称型 / NAT4），难打洞。
  NAT_MAPPING_HARD = 3;
}

message PunchRequest {
  // 16 字节随机，探测包按它找到会话。
  bytes session_id = 1;
  // 32 字节随机，探测包的 HMAC 密钥。只在端到端 mTLS 里传，协调节点看不到。
  bytes key = 2;
  // 只有 UDP：HOST + SRFLX，至多 8 个。
  repeated Candidate candidates = 3;
  NATMapping mapping = 4;
}

message PunchResponse {
  repeated Candidate candidates = 1;
  NATMapping mapping = 2;
}
